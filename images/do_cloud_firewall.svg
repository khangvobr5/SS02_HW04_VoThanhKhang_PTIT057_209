<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <!-- Background -->
  <rect width="960" height="620" fill="rgb(15, 23, 42)" rx="10" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Console Header Bar -->
  <rect width="960" height="46" fill="rgb(30, 41, 59)" rx="10"/>
  <rect y="36" width="960" height="10" fill="rgb(30, 41, 59)"/>
  <circle cx="22" cy="23" r="6" fill="#ef4444"/>
  <circle cx="40" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="23" r="6" fill="#22c55e"/>

  <text x="320" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    DigitalOcean Cloud Console &gt; Networking &gt; Firewalls &gt; ptit-firewall
  </text>

  <!-- Firewall Header Card -->
  <g transform="translate(30, 65)">
    <rect width="900" height="70" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="24" y="32" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="18" font-weight="700">ptit-firewall</text>
    <text x="24" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Applied to 1 Droplet: ubuntu-devops-server (128.199.200.100)</text>

    <!-- Status pill -->
    <rect x="760" y="22" width="110" height="26" rx="13" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
    <circle cx="776" cy="35" r="4" fill="#22c55e"/>
    <text x="788" y="39" fill="#22c55e" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Active</text>
  </g>

  <!-- Inbound Rules Section -->
  <g transform="translate(30, 150)">
    <rect width="900" height="225" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="24" y="32" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Inbound Rules (Chỉ cho phép SSH và HTTP)</text>

    <!-- Table Header -->
    <rect x="20" y="48" width="860" height="32" fill="rgba(15, 23, 42, 0.7)" rx="4"/>
    <text x="35" y="69" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">TYPE</text>
    <text x="180" y="69" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">PROTOCOL</text>
    <text x="320" y="69" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">PORT RANGE</text>
    <text x="480" y="69" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">SOURCES</text>

    <!-- Row 1: SSH -->
    <line x1="20" y1="80" x2="880" y2="80" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <rect x="20" y="85" width="860" height="55" fill="rgba(15, 23, 42, 0.3)" rx="4"/>
    <text x="35" y="117" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">SSH</text>
    <text x="180" y="117" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="13">TCP</text>
    <text x="320" y="117" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="13">22</text>
    <rect x="480" y="101" width="125" height="24" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="490" y="117" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">All IPv4, All IPv6</text>

    <!-- Row 2: HTTP -->
    <rect x="20" y="145" width="860" height="55" fill="rgba(15, 23, 42, 0.3)" rx="4"/>
    <text x="35" y="177" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">HTTP</text>
    <text x="180" y="177" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="13">TCP</text>
    <text x="320" y="177" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="13">80</text>
    <rect x="480" y="161" width="125" height="24" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="490" y="177" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">All IPv4, All IPv6</text>
  </g>

  <!-- Outbound Rules Section -->
  <g transform="translate(30, 390)">
    <rect width="900" height="130" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="24" y="32" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Outbound Rules (Cho phép lưu lượng ra ngoài)</text>

    <!-- Table Header -->
    <rect x="20" y="48" width="860" height="30" fill="rgba(15, 23, 42, 0.7)" rx="4"/>
    <text x="35" y="68" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">TYPE</text>
    <text x="180" y="68" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">PROTOCOL</text>
    <text x="320" y="68" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">PORT RANGE</text>
    <text x="480" y="68" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">DESTINATIONS</text>

    <!-- Row 1: All Traffic Out -->
    <rect x="20" y="82" width="860" height="38" fill="rgba(15, 23, 42, 0.3)" rx="4"/>
    <text x="35" y="106" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13">All Traffic</text>
    <text x="180" y="106" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="13">All</text>
    <text x="320" y="106" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="13">All</text>
    <text x="480" y="106" fill="#22c55e" font-family="'Consolas', monospace" font-size="12">All IPv4, All IPv6</text>
  </g>

  <!-- Droplets Applied Section -->
  <g transform="translate(30, 535)">
    <rect width="900" height="65" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="24" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Applied Droplets:</text>
    <rect x="150" y="20" width="220" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="166" cy="34" r="4" fill="#22c55e"/>
    <text x="178" y="38" fill="#f8fafc" font-family="'Consolas', monospace" font-size="12">ubuntu-devops-server</text>
  </g>
</svg>
